[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-learn_handwriting"
version = "0.1.0"
description = "Learn Handwriting environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git",
    "opencv-python-headless>=4.13.0.92",
    "openenv-core[core]>=0.2.2",
    # Environment-specific dependencies
    # Add all dependencies needed for your environment here
    # Examples:
    # "numpy>=1.19.0",
    # "torch>=2.0.0",
    # "gymnasium>=0.29.0",
    # "openspiel>=1.0.0",
    # "smolagents>=1.22.0,<2",
    "pillow>=12.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
train = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "trl>=0.16.0",
    "peft>=0.12.0",
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "bitsandbytes>=0.43.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m learn_handwriting.server.app
server = "learn_handwriting.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["learn_handwriting", "learn_handwriting.server"]
package-dir = { "learn_handwriting" = ".", "learn_handwriting.server" = "server" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
